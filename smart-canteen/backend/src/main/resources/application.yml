spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: 8080
app:
  jwt-secret: ${JWT_SECRET:change-this-local-secret-to-a-long-production-value}
  jwt-expiration-ms: 86400000
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:canteen;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_canteen}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
